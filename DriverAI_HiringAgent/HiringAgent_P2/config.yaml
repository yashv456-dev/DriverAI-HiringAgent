# DriverAI Hiring Agent - Business Configuration
# Secrets (CLIENT_ID, CLIENT_SECRET, etc.) stay in .env
# This file holds all tunable business logic: skills, roles, templates, filters.

company_name: "DriverAI"
admin_email: "yashv@driverai.io"

login:
  port: 8400

status_values:
  new: "New Email Received"
  scored: "Scored"
  rejected: "Rejected - Non-USA Location"
  needs_review: "Needs Review - Unreadable Resume"
  # Missing or conflicting current-location evidence stays on the main sheet.
  # It is neither exported as a confirmed candidate nor sent a decline.
  location_review: "Needs Review - Location Confirmation"
  # Historical value retained so older rejected rows can be recovered safely.
  location_unconfirmed: "Rejected - Location Not Confirmed"
  # A row that fails processing (unreadable resume, or any exception during scoring)
  # this many times in a row is moved to Rejected under this status - a permanently
  # unprocessable row would otherwise retry forever, once per --score-sharepoint run.
  processing_failed: "Rejected - Processing Error"
  # P1 already screens incoming mail for spam/scam/vendor-pitch content before a row is
  # ever created (see HiringAgent_P1/flow/flow_config.json spam_filters). This is P2's
  # secondary safety net for the rare row that still slips through: the resume/mail text
  # itself gets checked against content_safety.suspicious_phrases below, and a match stops
  # normal scoring, alerts admin_email, and leaves the row here for a human to look at -
  # added 2026-08-01 after the Futurism Technologies vendor-pitch incident.
  needs_review_spam: "Needs Review - Possible Spam"

# How many times a row may fail processing (unreadable resume OR an exception during
# scoring) before it's given up on and moved to Rejected. Env override: HIRING_SCORE_RETRY_MAX.
score_retry_max: 3

# Maximum consecutive candidate failures or timeouts before tripping the circuit breaker
# and stopping the bot. Protects the queue during an outage. Env override: HIRING_CONSECUTIVE_FAILURE_LIMIT.
consecutive_failure_limit: 3

# How many days a review row may sit unanswered before it is quietly closed off the main
# sheet. Applies to 'Needs Review - Location Confirmation' (clock starts when the
# clarification email went out) and 'Needs Review - Possible Spam' (clock starts from the
# row's last update). Closing is SILENT - the candidate is never emailed - and reversible:
# location rows are closed as 'Rejected - Location Not Confirmed', which is exactly what
# `bot.py --recover-locations` re-audits. Set to 0 to disable aging entirely and let review
# rows park indefinitely (the pre-2026-08-04 behaviour).
# Env override: HIRING_REVIEW_AGE_OUT_DAYS.
review_age_out_days: 14

# Seconds to pause between candidates while scoring. Each candidate costs several Graph
# calls, so a small gap keeps a long unattended run clear of throttling. Raise it if the
# client's tenant is throttling; set 0 to process back-to-back (the pre-2026-08-04
# behaviour). Never applied in --dry-run, or after the last candidate in a batch.
# Env override: HIRING_ROW_DELAY_SECONDS.
row_delay_seconds: 2

# P2's secondary content-safety net (see status_values.needs_review_spam above). Checked
# against the resume text AND mail body of every row before normal extraction runs.
# Deliberately short and specific - each phrase should be one essentially no genuine
# resume or cover email would ever contain, to keep false positives near zero. Not meant
# to be a comprehensive spam filter (that is P1's job, in flow_config.json) - only a
# backstop for the rare row that slips past it.
content_safety:
  suspicious_phrases:
    # vendor/agency self-promotion mistaken for a resume - live case, Futurism
    # Technologies (2026-08-01): a services vendor's "Company Profile and Corporate
    # Deck" was scored as if it were a candidate's resume.
    - "company profile and corporate deck"
    - "capability deck"
    - "engagement models"
    # unambiguous phishing/scam boilerplate - never appears in a genuine resume
    - "click here to claim"
    - "verify your account"
    - "wire transfer"
    - "crypto investment"
    - "you have won"
    - "claim your prize"
    - "your account has been suspended"
    - "confirm your identity"
    - "urgent action required"

# Admin alert email when a row is given up on after score_retry_max failures - separate
# from the non-USA decline (geo_reject_email) and from P1's own Notify_failure. Env
# override: HIRING_ERROR_EMAIL. Turn this off (or leave the .env override in place) during
# a bulk historical-replay test where no mail at all should go out.
error_email: true

# Kill-switch for outbound APPLICANT email - the direct counterpart of P1's
# flow_config.json email.send_applicant_emails. Env override: HIRING_SUPPRESS_EMAILS.
#
# Admin/error alerts are governed SEPARATELY by error_email above (P1's equivalent is
# send_admin_failure_alerts), so a silent-to-candidates system still reports its own
# breakage. Until 2026-08-03 this was a single master switch covering both, which meant
# P2 ran continuously and, if it broke, told nobody. For a genuine no-mail-whatsoever run
# (a bulk historical replay), set suppress_emails: true AND error_email: false.
#
# suppress_emails: true means no APPLICANT mail leaves P2, while the rest of the
# pipeline runs completely normally: rows are scored and patched, resumes are renamed and
# moved, the Rejected sheet is maintained, the client workbook is exported. It is enforced
# inside SharePointClient.send_mail(), the one function every sender calls, so it cannot be
# bypassed by a code path that forgets its own flag - which is exactly what the missing-info
# nudge did (it checked only whether a field was missing, never geo_reject_email).
#
# Rows touched while suppressed are stamped 'TEST-MODE (suppressed) <timestamp>' in
# Mail Sent / Decline Sent / Info Request Sent instead of 'Sent <timestamp>', so a replayed
# row is never mistaken for a candidate who was really contacted.
#
# CURRENT OPERATING POSTURE (set 2026-08-11, client instruction): LIVE APPLICANT MAIL.
# P2 processes real candidates against the live workbook AND contacts them for real - the
# non-USA decline, the missing-info / current-location nudge, and the Mail Sent stamp are all
# active. This matches P1's flow_config.json email.send_applicant_emails=true, so both phases
# now send. (Superseded the 2026-08-03 silent-running posture, which contacted nobody.)
#
# It is set HERE, in committed config, on purpose. It used to be true only because
# HIRING_SUPPRESS_EMAILS=true sat in .env - and .env is gitignored, so a fresh checkout, a
# redeploy, or a cleared .env would silently resume emailing real applicants. Defaulting to
# suppressed means the safe state survives losing that file; the .env override now only
# reinforces it. To genuinely start contacting applicants, change BOTH this value and the
# .env line, deliberately.
#
# NOTE when you do turn mail back on: nothing to do. A 'TEST-MODE (suppressed)' marker
# records that a send was WITHHELD, so since 2026-09-05 it no longer counts as contact -
# those rows stay in the queue and are emailed for real on the first live run, and the
# 14-day review age-out clock never started on them either. See _awaiting_send /
# _parse_marker_datetime in sharepoint_scoring.py.
test_mode:
  # TRUE as of 2026-09-04 (user instruction): SILENT REPLAY POSTURE, set so the whole
  # back catalogue can be re-imported and re-scored to backfill the new 'Experience'
  # column without re-contacting 167 candidates who were already answered. Declines,
  # missing-info nudges and the Mail Sent stamp are all withheld; scoring, resume
  # moves, the Rejected sheet and the client export keep running normally. Admin/error
  # alerts stay ON (error_email above), so a broken replay still reports itself.
  #
  # REVERT BOTH THIS AND .env's HIRING_SUPPRESS_EMAILS TO false ONCE THE REPLAY IS DONE,
  # or new applicants stop being contacted. Test Y10 in test_p2.py pins this value, so
  # the revert is enforced rather than remembered.
  #
  # See the NOTE above: rows touched during the replay keep their place in the mail queue -
  # a suppressed marker is not a send, so nothing has to be cleared by hand before going
  # live. (Superseded the 2026-08-11 live-applicant-mail posture, which is what to restore.)
  suppress_emails: true

columns:
  - "Application ID"
  - "Received Date"
  - "Last Updated Date"
  - "Category"
  # Moved to 5th position (right after Category) at client request, 2026-07-24. This is a
  # P2-written Excel CALCULATED column (clickable hyperlink to the resume); its formula reads
  # 'Resume URL'/'Original Filename' BY NAME, so its physical position is purely presentational
  # and safe to move. Every read/write in both P1 and P2 is keyed by column name, never index.
  - "Resume Link"
  - "Full Name"
  - "Email"
  - "Phone"
  - "Location"
  - "Country"
  # Total professional experience in whole years ("6 years"). Only ever a total the
  # candidate STATED: the resume's Summary/Profile blurb first (client's stated source,
  # 2026-09-04), then the headline block, then anywhere else in the document. Stored as
  # the lower bound of whatever was claimed ("6+ years" and "6 to 8 years" both store
  # "6 years"). Blank -> "Missing", same as its neighbours.
  #
  # NEVER derived. Not from graduation year, not from the job count, and not from the
  # span of the dated work history - that last one shipped briefly and was removed the
  # same day on user instruction ("just add years if its existing in summary"). It is
  # also NOT a scoring input: suggested_roles()/ai_score_roles() never see it, so
  # seniority cannot move a match % or a Category.
  #
  # Named and positioned to match what the client already added BY HAND to the live
  # master file, the Rejected sheet and the results sheet (2026-09-04): the header is
  # exactly "Years Exp" and it sits directly after Country, before
  # Current Skills. Both must stay in step with the live workbook - ensure_columns()
  # matches on the exact header text, so a rename here would add a SECOND column
  # alongside the hand-made one rather than adopting it.
  - "Years Exp"
  - "Current Skills"
  - "Education"
  # Start/end date of the candidate's most recent education entry, scanned from the same
  # resume text as 'Education' itself (added 2026-08-18, client request) - lets the client
  # see at a glance whether a candidate has graduated (past end date) or is still enrolled
  # ('Present'/'Expected <date>' as the end date). Blank when the resume states no dates;
  # never inferred or guessed.
  - "Education Start Date"
  - "Education End Date"
  - "Looking For Role"
  - "Suggested Role 1"
  - "Suggested Role 2"
  - "Suggested Role 3"
  - "Mail Subject"
  - "Mail Body"
  - "Status"
  - "Has Resume"
  - "Original Filename"
  - "Application Updates"
  - "Retry Count"
  - "Portfolio 1"
  - "Portfolio 2"
  - "Portfolio 3"
  # P2-written raw web URL of the saved resume (per row). Hidden — the real hyperlink target.
  # ('Resume Link', the clickable calculated column, was moved up to 5th position 2026-07-24.)
  - "Resume URL"
  # P2-written, VISIBLE, plain-text (not clickable) folder path only — no filename, e.g.
  # "HiringAgentP1Resume/2026/July" (or ".../2026/July/Rejected" for a rejected candidate) —
  # purely informational, shows which dated bucket the file lives in.
  - "Resume Folder Path"
  - "Mail Sent"
  # P2-written marker: blank = a missing-info nudge is still owed (if this candidate
  # is missing phone/location/skills/education or has conflicting current-location signals).
  # A historical 'Nothing missing' marker can be reopened only for current location/country
  # clarity. If the candidate sends an update after a Sent marker and location is still
  # unclear/conflicting, P2 moves the row to Rejected - Location Not Confirmed.
  - "Info Request Sent"

