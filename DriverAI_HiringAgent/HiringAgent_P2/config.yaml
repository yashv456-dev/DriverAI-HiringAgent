# Role → Category mapping (config-driven, first-match-wins, case-insensitive substring).
# Add new rules here as JDs grow — no code changes needed.
# Categories are used to populate the "Category" column in SharePoint so hiring
# managers can filter/sort candidates by department without separate sheets.
#
# EXCEPTION (added 2026-07-24, hiring_agent/scoring.py assign_category()): before these
# title rules run at all, an unambiguous native-mobile skill stack (Kotlin/Swift/Flutter/
# etc., see _MOBILE_TOOL_SKILLS) routes straight to "Mobile Apps (Android IOS)", unless a
# game-engine skill (Unity/Unreal/etc.) is also present. This is NOT config-driven — it
# exists because a mobile candidate's winning JD title sometimes lands in an unrelated
# category first (e.g. a JD titled "... Lead Developer ..." hits the "lead" rule below
# before ever reaching "mobile"/"android"), so the candidate's own skills override the
# title match for this one domain. Every other category is still decided by title text
# alone, exactly as documented above.
role_categories:
  rules:
    # ── 1a. Senior (Precedence at top) ───────────────────────────────────────
    - {match: "senior",            category: "Senior Manager"}
    - {match: "lead",              category: "Senior Manager"}
    - {match: "manager",           category: "Senior Manager"}
    - {match: "director",          category: "Senior Manager"}
    - {match: "head",              category: "Senior Manager"}
    - {match: "principal",         category: "Senior Manager"}

    # ── 1b. Executive (Precedence at top, split out of Senior & Executive,
    # client request 2026-08-21) ─────────────────────────────────────────────
    # 'word: true' means whole-word match instead of the default substring (see
    # assign_category). Required for the C-suite acronyms, which are all substrings of
    # ordinary title words: cto -> contraCTOr/doCTOr/faCTOry/seCTOr/direCTOr,
    # coo -> COOrdinator, cio -> suspiCIOus. Without it, "Contractor Position" and
    # "Sector Analyst" would both land in Executive.
    - {match: "executive",         category: "Executive"}
    - {match: "chief",             category: "Executive"}
    - {match: "ciso",              category: "Executive", word: true}
    - {match: "cmo",               category: "Executive", word: true}
    - {match: "cto",               category: "Executive", word: true}
    - {match: "ceo",               category: "Executive", word: true}
    - {match: "cfo",               category: "Executive", word: true}
    - {match: "coo",               category: "Executive", word: true}
    - {match: "cio",               category: "Executive", word: true}
    - {match: "officer",           category: "Executive"}

    # ── 2. AI/ML/CV (SIN2) ───────────────────────────────────────────────────
    - {match: "ai/ml",            category: "AI/ML/CV (SIN2)"}
    - {match: "ai / ml",          category: "AI/ML/CV (SIN2)"}
    - {match: "ai ml",            category: "AI/ML/CV (SIN2)"}
    - {match: "machine learning", category: "AI/ML/CV (SIN2)"}
    - {match: "deep learning",    category: "AI/ML/CV (SIN2)"}
    - {match: "nlp",              category: "AI/ML/CV (SIN2)"}
    - {match: "llm",              category: "AI/ML/CV (SIN2)"}
    - {match: "data scientist",   category: "AI/ML/CV (SIN2)"}

    # ── 3. Data Analytics ────────────────────────────────────────────────────
    - {match: "data analyst",     category: "Data Analytics"}
    - {match: "data analytics",   category: "Data Analytics"}
    - {match: "data science",     category: "Data Analytics"}
    - {match: "data engineer",    category: "Data Analytics"}
    - {match: "data engineering", category: "Data Analytics"}

    # ── 4. 3D/CV/ IoT/ AI Agents (SIN3) ──────────────────────────────────────
    - {match: "3d",               category: "3D/CV/ IoT/ AI Agents (SIN3)"}
    - {match: "cv",               category: "3D/CV/ IoT/ AI Agents (SIN3)"}
    - {match: "computer vision",  category: "3D/CV/ IoT/ AI Agents (SIN3)"}
    - {match: "iot",              category: "3D/CV/ IoT/ AI Agents (SIN3)"}
    - {match: "ai agent",         category: "3D/CV/ IoT/ AI Agents (SIN3)"}
    - {match: "agentic",          category: "3D/CV/ IoT/ AI Agents (SIN3)"}

    # ── 5. Cloud and DevOps ──────────────────────────────────────────────────
    - {match: "devops",           category: "Cloud and DevOps"}
    - {match: "cloud",            category: "Cloud and DevOps"}
    - {match: "aws",              category: "Cloud and DevOps"}
    - {match: "azure",            category: "Cloud and DevOps"}
    - {match: "gcp",              category: "Cloud and DevOps"}
    - {match: "infrastructure",   category: "Cloud and DevOps"}

    # ── 6. Web Team (Full stack/Back end & UI/UX) ────────────────────────────
    - {match: "backend",          category: "Web Team (Full stack/Back end & UI/UX)"}
    - {match: "front-end",        category: "Web Team (Full stack/Back end & UI/UX)"}
    - {match: "frontend",         category: "Web Team (Full stack/Back end & UI/UX)"}
    - {match: "full-stack",       category: "Web Team (Full stack/Back end & UI/UX)"}
    - {match: "full stack",       category: "Web Team (Full stack/Back end & UI/UX)"}
    - {match: "ui/ux",            category: "Web Team (Full stack/Back end & UI/UX)"}
    - {match: "ui ux",            category: "Web Team (Full stack/Back end & UI/UX)"}
    # word: true added 2026-08-21 - bare 'ux' as a substring also matched inside ordinary
    # words ("a-UX-iliary Systems Engineer" was landing in Web Team). Whole-word still
    # matches "UI/UX Designer" and "UI UX Developer", since '/' is not a word character.
    - {match: "ux",               category: "Web Team (Full stack/Back end & UI/UX)", word: true}
    - {match: "website",          category: "Web Team (Full stack/Back end & UI/UX)"}
    - {match: "web dev",          category: "Web Team (Full stack/Back end & UI/UX)"}

    # ── 6b. Gaming (split out of Graphics 2026-08-21, client request) ────────
    # MUST precede Graphics: "Game Designer" contains both 'game' and 'design', so if
    # Graphics ran first every game designer would land in Graphics instead of Gaming.
    - {match: "gaming",           category: "Gaming"}
    - {match: "game",             category: "Gaming"}

    # ── 6c. Graphics (design/rendering - originally split out of Web Team 2026-07-15;
    # gaming/game moved out to their own category 2026-08-21) ────────────────
    - {match: "graphics",         category: "Graphics"}
    - {match: "design",           category: "Graphics"}
    - {match: "rendering",        category: "Graphics"}
    - {match: "animation",        category: "Graphics"}

    # ── 7. Mobile Apps (Android IOS) ─────────────────────────────────────────
    - {match: "mobile",           category: "Mobile Apps (Android IOS)"}
    - {match: "android",          category: "Mobile Apps (Android IOS)"}
    - {match: "ios",              category: "Mobile Apps (Android IOS)"}
    - {match: "swift",            category: "Mobile Apps (Android IOS)"}
    - {match: "kotlin",           category: "Mobile Apps (Android IOS)"}
    - {match: "flutter",          category: "Mobile Apps (Android IOS)"}
    - {match: "react native",     category: "Mobile Apps (Android IOS)"}

    # ── 8. Business Analytics / Sales / Marketing ────────────────────────────
    # Split into three departments 2026-08-21 (client request); previously all one
    # "Business Analytics" category. ORDER INSIDE THIS BLOCK IS LOAD-BEARING - read on.
    #
    # The JD library has a genuinely dual-titled opening: "Business Analytics Marketing
    # Intern", which contains BOTH the analytics and marketing keywords, so whichever rule
    # is listed first claims it. The client's ruling (2026-08-21): the two JDs explicitly
    # named "DriverAI DUAL Business Analytics Marketing Intern" are Business Analytics,
    # while the plain "Business Analytics Marketing Intern" is Marketing. That is why the
    # narrow 'dual business analytics' rule is hoisted ABOVE Marketing and the general
    # 'business analytics' rule sits BELOW it - the specific case is matched first, then
    # anything still carrying 'marketing' falls to Marketing, and only a title with neither
    # reaches the general Business Analytics rules at the bottom.

    # 8a. The explicit dual-role JD only (must precede Marketing - see above).
    - {match: "dual business analytics", category: "Business Analytics"}

    # 8b. Sales - the PDs folder grew a 'Sales - Admin' bucket and "Sales and Business
    # Development Representative" was falling through to General. 'word: true' keeps
    # 'sales' off wholesales/presales-style compounds.
    - {match: "sales",            category: "Sales - Admin", word: true}
    - {match: "business development", category: "Sales - Admin"}

    # 8c. Marketing - also claims the plain "Business Analytics Marketing Intern".
    - {match: "marketing",        category: "Marketing - Admin"}
    - {match: "marketer",         category: "Marketing - Admin"}

    # 8d. Business Analytics (general) - only reached by titles with no sales/marketing
    # signal at all, e.g. a plain "Business Analyst" or "Business Analytics Intern".
    - {match: "business analyst", category: "Business Analytics"}
    - {match: "business analytics", category: "Business Analytics"}
    - {match: "consultant",       category: "Business Analytics"}

    # ── 9. Supply Chain ──────────────────────────────────────────────────────
    - {match: "supply chain",     category: "Supply Chain"}
    - {match: "logistics",        category: "Supply Chain"}
    - {match: "procurement",      category: "Supply Chain"}

    # ── 10. Finance ──────────────────────────────────────────────────────────
    - {match: "finance",          category: "Finance - Admin"}
    - {match: "financial",        category: "Finance - Admin"}
    - {match: "accountant",       category: "Finance - Admin"}
    - {match: "accounting",       category: "Finance - Admin"}

    # ── 11. Cybersecurity and IT Admin ───────────────────────────────────────
    - {match: "cybersecurity",    category: "Cybersecurity and IT Admin"}
    - {match: "security analyst", category: "Cybersecurity and IT Admin"}
    - {match: "tech support",     category: "Cybersecurity and IT Admin"}
    - {match: "it support",       category: "Cybersecurity and IT Admin"}
    - {match: "help desk",        category: "Cybersecurity and IT Admin"}
    - {match: "technical support",category: "Cybersecurity and IT Admin"}
    - {match: "it admin",         category: "Cybersecurity and IT Admin"}

    # ── 12. Data Center ──────────────────────────────────────────────────────
    - {match: "data center",      category: "Data Center"}
    - {match: "datacenter",       category: "Data Center"}
    - {match: "hardware",         category: "Data Center"}
    - {match: "network engineer", category: "Data Center"}

    # ── 13. Satellite ────────────────────────────────────────────────────────
    - {match: "satellite",        category: "Satellite"}
    - {match: "aerospace",        category: "Satellite"}
    - {match: "telecom",          category: "Satellite"}
    - {match: "communications",   category: "Satellite"}

    # No generic "developer"/"engineer" catch-all here on purpose (removed 2026-07-15):
    # every real Web Team role already matches a specific rule above (backend/frontend/
    # full-stack/website/web dev), so a bare substring catch-all only ever mis-routed
    # roles that aren't web roles at all - e.g. "RPA / Automation Engineer" and
    # "Intern / Entry-Level Engineer" (the latter directly contradicting the client's
    # own "intern etc. goes to General" instruction). Anything not explicitly matched
    # above correctly falls through to General, same as marketing/design/gaming did
    # before their own rules were added.
  default: "General"

