# Geo-classification lists (still actively used by geo.py/extraction.py — the four
# email/sender spam-gate keys that used to live here (system_sender_locals/domains,
# skip_subject_patterns, spam_body_phrases) were removed: nothing in this codebase read
# them (P1 already gates spam before anything reaches SharePoint; P2 has no inbox pipeline
# of its own).
filters:
  # ── Geo filter: USA-only hiring ──────────────────────────────────────────
  # The code detects USA via: "City, TX" / "City, Texas" patterns (all 50
  # states + DC + territories), "United States" / "USA" / "U.S." country
  # terms, and US ZIP codes. This list adds *unambiguous* US city names that
  # someone might write without a state qualifier so they are recognized as
  # USA (and therefore KEPT). Ambiguous cities (London, Birmingham, etc.)
  # are excluded — they only count as USA when paired with a state or "US".
  # Unambiguous US city/town/metro names recognized as USA even WITHOUT a state.
  # Ambiguous names also major abroad (London, Paris, Manchester) are excluded -
