# Email templates with {company}, {greeting}, {ref}, {original_subject} placeholders.
# ({greeting} = candidate's first name, derived from the "Full Name" column; falls back to
# "there" if blank.)
email_templates:
  acknowledgment:
    subject: "Thanks for applying to {company} - we've received your application (Ref: {ref})"
    body: |
      <div style="font-family:Arial,Helvetica,sans-serif;font-size:14px;color:#222;line-height:1.6;">
      <p>Hi {greeting},</p>
      <p>Thanks so much for applying to {company} - we're glad you're interested in joining the team.</p>
      <p>Just a quick note to confirm your application reached us safely and is now with our recruiting team for review. For your records, your reference number is <strong>{ref}</strong>.</p>
      <p>We read every application carefully. If your experience looks like a strong fit, someone from our team will reach out about next steps - and we'll be in touch either way.</p>
      <p>Thanks again, and have a great day!</p>
      <p>Warm regards,<br>The {company} Recruiting Team</p>
      </div>

  request_cv:
    subject_with_ref: "Please attach your CV - your {company} application (Ref: {ref})"
    subject_without_ref: "Please attach your CV - your {company} application (Re: {original_subject})"
    body: |
      <div style="font-family:Arial,Helvetica,sans-serif;font-size:14px;color:#222;line-height:1.6;">
      <p>Hello,</p>
      <p>Thanks for reaching out to the {company} team!</p>
      <p>There does not appear to be a CV/resume included. Please resend your submission along with your resume in PDF or Word format. We will process your application upon receipt.</p>
      {ref_line}
      <p>We are looking forward to hearing from you!</p>
      <p>Warm regards,<br>The {company} Recruiting Team</p>
      </div>

  # Sent by P2 (--score-sharepoint) to a SCORED candidate who's missing phone/location/
  # skills/education after extraction, or whose kept row has an ambiguous current
  # location/country (portfolio deliberately NOT checked - client request 2026-07-15).
  # {missing_list} is built at send time, e.g. "your phone number and your education
  # background" - only the fields actually missing/unclear are named. This candidate is
  # NOT rejected - clear non-USA rejects; every other gap just gets this friendly nudge
  # while staying in the pipeline.
  missing_info:
    subject: "Quick follow-up on your {company} application (Ref: {ref})"
    body: |
      <div style="font-family:Arial,Helvetica,sans-serif;font-size:14px;color:#222;line-height:1.6;">
      <p>Hi {greeting},</p>
      <p>Thanks again for applying to {company} - your application (Ref: <strong>{ref}</strong>) is with our recruiting team.</p>
      <p>While reviewing it, we noticed we don't have {missing_list} on file. Replying to this email with an updated resume that includes that information would help us move your application along faster.</p>
      <p>No action is needed if you'd rather not share it - we'll continue reviewing your application either way.</p>
      <p>Warm regards,<br>The {company} Recruiting Team</p>
      </div>

  # Polite decline sent by P2 (--score-sharepoint) when a candidate is outside the USA.
  rejection_non_usa:
    subject: "Update on Your {company} Application"
    body: |
      <div style="font-family:Arial,Helvetica,sans-serif;font-size:14px;color:#222;line-height:1.7;">
      <p>Hi {greeting},</p>
      <p>Thank you for your interest in <strong>{company}</strong> and for taking the time to apply.</p>
      <p>After reviewing your application, we are currently able to consider candidates based in the United States only, so we are unable to move forward at this time.</p>
      <p>We truly appreciate your interest. We are growing and hope to expand into more regions in the future, and we would be glad to have you apply again when we do.</p>
      <p>You do not need to reply. We wish you all the best in your search.</p>
      <p>Warm regards,<br>The {company} Recruiting Team</p>
      </div>

# AI extraction settings.
#  - Ollama (FREE, local LLM): the only AI brain in this deployment. No API key, no cost.
#       Install Ollama (https://ollama.com), then: `ollama pull llama3.2` and set
#       ollama.enabled: true. If Ollama isn't running, the bot silently uses the
#       offline regex parser - nothing breaks.
ai_extraction:
  text_limit: 12000
  ollama:
    enabled: true
    model: "qwen3-1.7b-p2:latest"
    host: "http://localhost:11434"
    # Fixed sampling seed for every model call. temperature 0 alone gave different role
    # scores on identical input (measured 2026-09-14); with a seed, repeated runs match.
    seed: 42
    # Give-up threshold per attempt, not a performance setting: about 3x the earlier
    # worst measured extraction (62.1s). Retained at 180 after measuring thinking off,
    # a 512-token output cap, and JSON schemas; see docs/benchmarks/stage2a/REPORT.md.
    # Extraction retries a timeout once; a second timeout uses the existing fallback
    # and require_ai gate. Connection failures are not retried.
    timeout: 180
    # Separate, longer timeout just for role-fit scoring (rates the candidate against
    # every open role in one prompt - the heaviest Ollama call, needs real headroom).
    # Measured 48.4s against 106 roles.
    scoring_timeout: 150
    # NEVER publish a row the model did not actually read. When true, a candidate whose
    # extraction or scoring fell back to the offline parser / keyword scorer is DEFERRED,
    # not written: its Status stays 'New Email Received' and the next run retries it.
    #
    # Deliberately NOT wired to Retry Count. That counter is for candidate-side problems
    # (an unreadable resume) and gives up to 'Rejected - Processing Error' after
    # score_retry_max strikes. A model timeout is an INFRASTRUCTURE problem - rejecting a
    # real applicant because the machine was slow three times would be far worse than the
    # bug this setting fixes.
    #
    # Tier 1 regex (phone, skills, portfolio URLs) is NOT affected. That is deliberate
    # extraction, not a fallback: a regex is strictly better than a 1.7B model at pulling
    # a URL or a phone number out of text, and Ollama is never asked to override it.
    require_ai: true
    # Use the Ollama brain for SCORING too (role-fit % + reasoning), not just reading.
    # Falls back to the deterministic keyword scorer when Ollama is off/unavailable.
    scoring: true

# Geo filter: keep USA candidates, reject non-USA (set false to score everyone).
geo_filter_usa_only: true

# When a candidate is rejected as non-USA, email them the polite 'rejection_non_usa' decline
# (sent FROM SENDER_MAILBOX via Graph; needs Mail.Send Application consent). Set false to reject silently.
geo_reject_email: true

# Scoring parameters.
scoring:
  min_match_percent: 20
  top_n: 3
  # Explicit candidate role-family preference must outweigh a small generic JD whose
  # short skills list otherwise inflates percentage overlap.
  title_boost: 40
  # Prevent a one- or two-keyword JD parse from producing an artificial 100% match.
  min_role_skills_denominator: 5
  max_skills_display: 40
  # Max candidates scored in ONE run. Raised 25 -> 500 on 2026-07-31 so a desktop/CLI run
  # drains the whole queue in a single pass instead of silently stopping at 25 and printing
  # "Processing first 25 (batch limit)". 500 comfortably covers a full mailbox replay.
  # Override per-run with --batch-size N, the app's Batch selector, or the env var
  # HIRING_SCORING_BATCH_LIMIT. NOTE: this cap exists to protect the Azure Functions
  # deployment from its 10-minute execution ceiling - if P2 is ever run serverless again,
  # drop this back to ~25 there (or set HIRING_SCORING_BATCH_LIMIT in the function's app
  # settings) so a large batch cannot be killed mid-run.
  batch_limit: 500
