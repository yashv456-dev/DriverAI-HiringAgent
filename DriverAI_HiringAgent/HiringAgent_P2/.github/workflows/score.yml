name: Score SharePoint queue

# Serverless, card-free host: GitHub's runners execute the same worker on a schedule.
# Assumes this folder (HiringAgent_P2) is the repository root.
#
# The scheduled trigger is intentionally disabled. Use workflow_dispatch only after
# removing HIRING_P2_DISABLED and deliberately re-enabling P2.
# GitHub Actions evaluates 'on.schedule.cron' at parse time — Actions Variables cannot
# be used there. Examples:
#   */15 * * * *   every 15 min
#   0 9,18 * * *   9am + 6pm UTC daily
on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run (read + log only, no writes)'
        type: boolean
        default: true

# Don't let a slow run overlap the next scheduled one.
concurrency:
  group: score-sharepoint
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  score:
    runs-on: ubuntu-latest
    env:
      HIRING_SERVERLESS: '1'          # console logging, temp scratch, offline brain (no Ollama)
      HIRING_P2_DISABLED: 'true'
      TENANT_ID: ${{ secrets.TENANT_ID }}
      CLIENT_ID: ${{ secrets.CLIENT_ID }}
      CLIENT_SECRET: ${{ secrets.CLIENT_SECRET }}
      SHAREPOINT_HOSTNAME: ${{ secrets.SHAREPOINT_HOSTNAME }}
      SHAREPOINT_SITE_PATH: ${{ secrets.SHAREPOINT_SITE_PATH }}
      SHAREPOINT_TABLE: ${{ secrets.SHAREPOINT_TABLE }}
      SHAREPOINT_RESUMES_FOLDER: ${{ secrets.SHAREPOINT_RESUMES_FOLDER }}
      HIRING_GEO_USA_ONLY: ${{ vars.HIRING_GEO_USA_ONLY || 'true' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install deps
        run: grep -v '^azure-functions' requirements.txt | pip install -r /dev/stdin
      - name: Verify credentials
        run: python bot.py --test-sharepoint
      - name: Score the queue
        run: |
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            python bot.py --score-sharepoint --dry-run
          else
            python bot.py --score-sharepoint
          fi
